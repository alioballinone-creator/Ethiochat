plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

android {
    namespace "com.ethiochat.myapp"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.ethiochat.myapp"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    def releaseKeystore = System.getenv("KEYSTORE_FILE")
    def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("KEY_ALIAS")
    def releaseKeyPassword = System.getenv("KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystore != null && !releaseKeystore.trim().isEmpty() &&
        releaseStorePassword != null && !releaseStorePassword.isEmpty() &&
        releaseKeyAlias != null && !releaseKeyAlias.isEmpty() &&
        releaseKeyPassword != null && !releaseKeyPassword.isEmpty()
    def releaseRequested = gradle.startParameter.taskNames.any {
        it.toLowerCase(Locale.ROOT).contains("release")
    }

    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured. Set KEYSTORE_FILE, KEYSTORE_PASSWORD, " +
            "KEY_ALIAS and KEY_PASSWORD. Debug signing is never used for releases."
        )
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
