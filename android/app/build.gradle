plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

android {
    namespace "com.ethiochat.myapp"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.ethiochat.myapp"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    def signingProperties = new Properties()
    def signingPropertiesFile = rootProject.file("key.properties")
    if (signingPropertiesFile.exists()) {
        signingPropertiesFile.withInputStream { signingProperties.load(it) }
    }

    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")
        ?: System.getenv("KEYSTORE_FILE")
        ?: signingProperties.getProperty("storeFile")
    def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
        ?: System.getenv("KEYSTORE_PASSWORD")
        ?: signingProperties.getProperty("storePassword")
    def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
        ?: System.getenv("KEY_ALIAS")
        ?: signingProperties.getProperty("keyAlias")
    def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
        ?: System.getenv("KEY_PASSWORD")
        ?: signingProperties.getProperty("keyPassword")
    def hasReleaseSigning = releaseKeystore != null && !releaseKeystore.toString().trim().isEmpty() &&
        releaseStorePassword != null && !releaseStorePassword.toString().isEmpty() &&
        releaseKeyAlias != null && !releaseKeyAlias.toString().isEmpty() &&
        releaseKeyPassword != null && !releaseKeyPassword.toString().isEmpty()
    def releaseRequested = gradle.startParameter.taskNames.any {
        it.toLowerCase(Locale.ROOT).contains("release")
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                def ks = file(releaseKeystore.toString())
                if (ks.exists()) {
                    storeFile ks
                    storePassword releaseStorePassword.toString()
                    keyAlias releaseKeyAlias.toString()
                    keyPassword releaseKeyPassword.toString()
                }
            }
        }
        debug {
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning && signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
