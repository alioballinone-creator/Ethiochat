name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
      PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
      PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_REF" ]]; then
            if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
              echo "::error::SUPABASE_ACCESS_TOKEN is not configured. Refusing to deploy."
            fi
            if [[ -z "$SUPABASE_DB_PASSWORD" ]]; then
              echo "::error::SUPABASE_DB_PASSWORD is not configured. Refusing to deploy."
            fi
            if [[ -z "$SUPABASE_PROJECT_REF" ]]; then
              echo "::error::SUPABASE_PROJECT_REF is not configured. Refusing to deploy."
            fi
            exit 1
          fi

          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF must be the 20-character Supabase project reference, not a URL or API key."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlparse

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          supabase_url = os.environ.get("SUPABASE_URL", "").strip()
          if not supabase_url:
              print("::warning::SUPABASE_URL is not configured; project-ref consistency cannot be checked.")
              sys.exit(0)

          parsed_url = urlparse(supabase_url)
          if parsed_url.scheme != "https" or not parsed_url.hostname:
              print("::error::SUPABASE_URL must be a valid HTTPS URL.")
              sys.exit(1)

          host = parsed_url.hostname
          match = re.fullmatch(r"([a-z0-9]{20})\.supabase\.co", host)
          if host.endswith(".supabase.co") and not match:
              print("::error::SUPABASE_URL is not a valid canonical Supabase project URL.")
              sys.exit(1)
          if match and match.group(1) != project_ref:
              print("::error::SUPABASE_PROJECT_REF does not match the project reference in SUPABASE_URL.")
              sys.exit(1)
          if not match:
              print("::warning::SUPABASE_URL uses a custom domain; project-ref consistency cannot be derived from its host.")
          PY

          optional_missing=0
          if [[ -z "$LIVEKIT_API_KEY" && -z "$LIVEKIT_API_SECRET" && -z "$LIVEKIT_URL" ]]; then
            echo "::warning::LiveKit credentials are absent; calling features remain unavailable."
          elif [[ -z "$LIVEKIT_API_KEY" || -z "$LIVEKIT_API_SECRET" || -z "$LIVEKIT_URL" ]]; then
            echo "::error::Configure LIVEKIT_API_KEY, LIVEKIT_API_SECRET, and LIVEKIT_URL together or leave all three unset."
            optional_missing=1
          fi

          if [[ -z "$FCM_SERVICE_ACCOUNT_JSON" && -z "$PUSH_WEBHOOK_SECRET" ]]; then
            echo "::warning::FCM and push webhook secrets are absent; push dispatch remains unavailable."
          elif [[ -z "$FCM_SERVICE_ACCOUNT_JSON" || -z "$PUSH_WEBHOOK_SECRET" ]]; then
            echo "::error::Configure FCM_SERVICE_ACCOUNT_JSON and PUSH_WEBHOOK_SECRET together or leave both unset."
            optional_missing=1
          else
            printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | python3 -c '
          import json, sys
          try:
              value = json.load(sys.stdin)
              valid = all(isinstance(value.get(key), str) and value[key] for key in ("project_id", "client_email", "private_key"))
          except (json.JSONDecodeError, AttributeError):
              valid = False
          if not valid:
              print("::error::FCM_SERVICE_ACCOUNT_JSON must be valid service-account JSON with project_id, client_email, and private_key.")
              sys.exit(1)
          '
          fi

          if [[ -z "$PAYMENT_WEBHOOK_SECRET" ]]; then
            echo "::warning::PAYMENT_WEBHOOK_SECRET is absent; payment webhook requests will fail closed."
          fi
          exit "$optional_missing"

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push --include-all

      - name: Configure function secrets
        run: |
          secrets=()
          if [ -n "$LIVEKIT_API_KEY" ]; then secrets+=("LIVEKIT_API_KEY=$LIVEKIT_API_KEY"); fi
          if [ -n "$LIVEKIT_API_SECRET" ]; then secrets+=("LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET"); fi
          if [ -n "$LIVEKIT_URL" ]; then secrets+=("LIVEKIT_URL=$LIVEKIT_URL"); fi
          if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then secrets+=("FCM_SERVICE_ACCOUNT_JSON=$FCM_SERVICE_ACCOUNT_JSON"); fi
          if [ -n "$PUSH_WEBHOOK_SECRET" ]; then secrets+=("PUSH_WEBHOOK_SECRET=$PUSH_WEBHOOK_SECRET"); fi
          if [ -n "$PAYMENT_WEBHOOK_SECRET" ]; then secrets+=("PAYMENT_WEBHOOK_SECRET=$PAYMENT_WEBHOOK_SECRET"); fi
          if [ "${#secrets[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${secrets[@]}"
          else
            echo "::warning::No provider secrets configured. Calls, push and payments will fail closed at runtime."
          fi

      - name: Deploy authenticated functions
        run: |
          for fn in wallet-transfer wallet-redpacket contact-discovery livekit-token call-control delete-account export-account; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Deploy webhook functions
        run: |
          supabase functions deploy payment-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy push-dispatch --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed function list
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
