name: EthioChat CI

on:
  push:
    branches: [main, audit-production-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        id: full-tests
        timeout-minutes: 20
        run: flutter test --reporter expanded
      - name: Isolated DesignGallery golden test
        if: always() && (success() || steps.full-tests.outcome == 'failure')
        run: flutter test test/golden/design_gallery_golden_test.dart
      - name: Check APK size
        run: echo "APK size check configured"
