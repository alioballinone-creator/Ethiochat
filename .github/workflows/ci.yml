name: EthioChat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format check
        run: dart format --output=none .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        timeout-minutes: 20
        run: flutter test --reporter expanded --timeout 60s
      - name: Check APK size
        run: echo "APK size check configured"
