name: Flutter Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-appbundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build AAB
        run: flutter build appbundle --release --no-tree-shake-icons || flutter build appbundle --release || true
      - name: Build APK
        run: flutter build apk --release --split-per-abi || true
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
