name: Update Goldens

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true
      - name: Update goldens
        run: flutter test test/golden/design_gallery_golden_test.dart --update-goldens
      - name: Commit updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/golden/goldens/*.png test/golden/failures || true
          git diff --cached --quiet || git commit -m "chore: update golden files"
          git push
