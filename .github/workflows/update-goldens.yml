name: Update Goldens (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update goldens on'
        required: true
        default: 'audit-production-readiness'

permissions:
  contents: write

concurrency:
  group: update-goldens-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Update design gallery goldens
        run: flutter test --update-goldens test/golden/design_gallery_golden_test.dart

      - name: Verify goldens pass
        run: flutter test test/golden/design_gallery_golden_test.dart

      - name: Upload golden artifacts
        uses: actions/upload-artifact@v4
        with:
          name: design-gallery-goldens
          path: test/goldens/*.png
          if-no-files-found: error

      - name: Stage and verify golden changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'test/goldens/*.png'
          git diff --cached --name-only
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No golden PNG changes to commit"
            exit 0
          fi
          # Ensure only intended files staged
          if [ "$(git diff --cached --name-only | grep -v '^test/goldens/.*\.png$' | wc -l)" -ne 0 ]; then
            echo "Unintended files staged"
            git diff --cached --name-only
            exit 1
          fi

      - name: Commit updated goldens
        run: |
          git commit -m "Update design gallery goldens via workflow"
          git push origin HEAD:${{ github.event.inputs.branch }}
