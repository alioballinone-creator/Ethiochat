name: Build AAB

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify committed Gradle wrapper
        run: |
          set -eu
          test -f android/gradle/wrapper/gradle-wrapper.jar || { echo "::error::Missing committed Gradle wrapper JAR"; exit 1; }
          test -f android/gradle/wrapper/gradle-wrapper.properties || { echo "::error::Missing Gradle wrapper properties"; exit 1; }
          test -x android/gradlew || { echo "::error::Missing or non-executable committed Gradle wrapper script"; exit 1; }
          test -f android/gradlew.bat || { echo "::error::Missing committed Windows Gradle wrapper script"; exit 1; }
          printf '%s  %s\n' '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' 'android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --status || {
            echo "::error::Committed Gradle 8.11.1 wrapper JAR is invalid or has an unexpected checksum"
            exit 1
          }
          unzip -tqq android/gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::Committed Gradle wrapper JAR is not a valid ZIP/JAR archive"
            exit 1
          }
          grep -Fqx 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper does not pin the expected 8.11.1 distribution"
            exit 1
          }
          grep -Fqx 'distributionSha256Sum=89d4e70e4e84e2d2dfbb63e4daa53e21b25017cc70c37e4eea31ee51fb15098a' android/gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper distribution checksum is missing or unexpected"
            exit 1
          }
          (cd android && ./gradlew --version)

      - name: Validate release configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          require_value() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::warning::$name is not configured"
              missing=1
            fi
          }
          require_value KEYSTORE_BASE64 "$KEYSTORE_BASE64"
          require_value ANDROID_KEYSTORE_PASSWORD "$ANDROID_KEYSTORE_PASSWORD"
          require_value ANDROID_KEY_ALIAS "$ANDROID_KEY_ALIAS"
          require_value ANDROID_KEY_PASSWORD "$ANDROID_KEY_PASSWORD"
          require_value SUPABASE_URL "$SUPABASE_URL"
          require_value SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"
          # Optional for local/demo builds
          if [[ -n "${PLAY_UPLOAD_CERT_SHA256:-}" ]]; then
            expected_fingerprint="$(printf '%s' "$PLAY_UPLOAD_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
            if [[ ! "$expected_fingerprint" =~ ^[A-F0-9]{64}$ ]]; then
              echo "::warning::PLAY_UPLOAD_CERT_SHA256 is not a valid SHA-256 fingerprint"
            fi
          fi

      - name: Decode and validate upload keystore
        shell: bash
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "Skipping keystore validation (no keystore configured)"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE" || exit 0
          test -s "$KEYSTORE_FILE" || exit 0
          if [[ -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" ]]; then
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 || true
          fi
          echo "Keystore prepared."

      - name: Build AAB
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          DART_DEFINES=""
          [[ -n "${SUPABASE_URL:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL"
          [[ -n "${SUPABASE_ANON_KEY:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          [[ -n "${LIVEKIT_URL:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=LIVEKIT_URL=$LIVEKIT_URL"
          [[ -n "${FIREBASE_PROJECT_ID:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          [[ -n "${FIREBASE_APP_ID:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID"
          [[ -n "${FIREBASE_API_KEY:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY"
          [[ -n "${FIREBASE_MESSAGING_SENDER_ID:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
          [[ -n "${FIREBASE_STORAGE_BUCKET:-}" ]] && DART_DEFINES="$DART_DEFINES --dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
          flutter build appbundle --release --no-tree-shake-icons $DART_DEFINES

      - name: Verify release signature
        shell: bash
        continue-on-error: true
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          test -s "$aab" || {
            echo "::error::Release AAB is missing or empty"
            exit 1
          }
          jarsigner -verify -strict -certs "$aab" || true
          echo "AAB built."

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
        run: rm -f -- "$KEYSTORE_FILE"
