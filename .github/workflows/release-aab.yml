name: Build release AAB

on:
  workflow_dispatch:
  push:
    branches: [main, signed-release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            val="${!name:-}"
            if [[ -z "$val" ]]; then
              echo "::error::$name is empty or not configured"
              missing=1
            fi
          done
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release

      - name: Verify AAB signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          KS="$RUNNER_TEMP/upload.jks"
          test -s "$KS"
          # Run jarsigner verify and check output contains "jar verified"
          VERIFY_OUT=$(jarsigner -verify -certs "$AAB" 2>&1 || true)
          echo "$VERIFY_OUT" | tail -15
          echo "$VERIFY_OUT" | grep -q "jar verified"
          # Extract signer fingerprint from AAB
          AAB_FP=$(unzip -p "$AAB" 'META-INF/*.RSA' 2>/dev/null | keytool -printcert 2>/dev/null | grep -i "SHA256" | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          # Extract signer fingerprint from keystore
          KS_FP=$(keytool -list -v -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null | grep -A1 "SHA256:" | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "AAB_SHA256_FINGERPRINT=$AAB_FP"
          echo "KS_SHA256_FINGERPRINT=$KS_FP"
          if [[ -z "$AAB_FP" || -z "$KS_FP" || "$AAB_FP" != "$KS_FP" ]]; then
            echo "::error::Signing certificate fingerprint mismatch"
            exit 1
          fi
          echo "Signature verification passed and matches upload key."

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
