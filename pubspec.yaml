name: ethiochat
description: EthioChat - a WeChat-class super-app for Ethiopia and the Horn of Africa.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local persistence
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Backend
  supabase_flutter: ^2.6.0

  # Platform & UX
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.4.0
  flutter_local_notifications: ^17.2.2
  image_picker: ^1.1.2
  image: ^4.2.0
  flutter_blurhash: ^0.8.2
  permission_handler: ^11.3.1

  # Firebase (optional at runtime; configured per-environment)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Utils
  uuid: ^4.4.0
  crypto: ^3.0.3
  intl: ^0.20.2
  collection: ^1.18.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
  fonts:
    # Variable fonts: a single file covers the full weight axis and keeps the
    # bundle small for low-end devices.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
